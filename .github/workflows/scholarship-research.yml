name: Scholarship Deep Research (12h)

on:
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:

concurrency:
  group: scholarship-deep-research
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dateutil

      - name: Deep-research NSP + official sources
        run: |
          python scripts/deep_research.py

      - name: Validate generated JSON
        run: |
          python -m json.tool src/data/autoScholarships.json > /dev/null
          python - <<'PY'
          import json
          from datetime import date
          p=json.load(open("src/data/autoScholarships.json", encoding="utf-8"))
          assert p["schemaVersion"] == 2
          assert isinstance(p["opportunities"], list)
          for x in p["opportunities"]:
              assert x.get("id") and x.get("sources")
              assert x.get("verification", {}).get("status") == "VERIFIED OFFICIAL"
              if x.get("deadline"):
                  assert x["deadline"] >= date.today().isoformat()
          print("Validated", len(p["opportunities"]), "live records")
          PY

      - name: Production build gate
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit research updates
        run: |
          git config user.name "scholarship-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/autoScholarships.json; then
            echo "No scholarship-data change."
            exit 0
          fi
          git add src/data/autoScholarships.json
          git commit -m "chore(data): refresh verified scholarship intelligence"
          git push
